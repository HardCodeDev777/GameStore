services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: my_app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: app_server
    restart: always
    ports:
      - "8080:8080" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__GameStoreDbSource=Host=db;Port=5432;Database=my_app_db;Username=postgres;Password=1234
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend/GameStoreSite
      dockerfile: Dockerfile
    container_name: app_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://server:8080
    depends_on:
      - server
    volumes:
      - ./frontend/GameStoreSite:/app
      - /app/node_modules

volumes:
  postgres_data: